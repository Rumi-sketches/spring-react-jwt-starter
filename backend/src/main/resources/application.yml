spring:
  application:
    name: jwt-starter
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jwtdemo}
    username: ${SPRING_DATASOURCE_USERNAME:jwtdemo_user}
    password: ${SPRING_DATASOURCE_PASSWORD:jwtdemo_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

app:
  jwt:
    secret: ${APP_JWT_SECRET:p8F6Kr53Zoa0v6CHLQwhFlbumlXVZnjgJOEc9WreUcU=}
    access-token-expiration-ms: ${APP_JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
    refresh-token-expiration-days: ${APP_JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}
  cookie:
    secure: ${APP_COOKIE_SECURE:false}

logging:
  level:
    com.jwtdemo.jwt_starter.backend: DEBUG