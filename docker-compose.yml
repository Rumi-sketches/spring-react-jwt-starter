services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jwtdemo
      POSTGRES_USER: jwtdemo_user
      POSTGRES_PASSWORD: jwtdemo_pass
      TZ: Europe/Rome
      JAVA_TOOL_OPTIONS: -Duser.timezone=Europe/Rome
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jwtdemo_user -d jwtdemo"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jwtdemo
      SPRING_DATASOURCE_USERNAME: jwtdemo_user
      SPRING_DATASOURCE_PASSWORD: jwtdemo_pass
      APP_JWT_SECRET: p8F6Kr53Zoa0v6CHLQwhFlbumlXVZnjgJOEc9WreUcU=
      APP_JWT_ACCESS_TOKEN_EXPIRATION_MS: 900000
      APP_JWT_REFRESH_TOKEN_EXPIRATION_DAYS: 7
      APP_COOKIE_SECURE: false
      TZ: Europe/Rome

  frontend:
    build: ./frontend
    tty: true
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_URL: http://backend:8080
      TZ: Europe/Rome

volumes:
  postgres_data: